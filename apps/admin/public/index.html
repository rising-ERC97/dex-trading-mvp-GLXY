<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>DEX Ops</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand-block">
          <a class="brand" href="#overview" aria-label="DEX Ops home">
            <span class="brand-mark" aria-hidden="true"></span>
            DEX
            <span class="brand-tag">Ops</span>
          </a>
        </div>
        <nav class="nav" id="nav" aria-label="Ops views">
          <a href="#overview" data-view="overview">Overview</a>
          <a href="#feeds" data-view="feeds">Feeds</a>
          <a href="#risk" data-view="risk">Risk</a>
          <a href="#markets" data-view="markets">Markets</a>
        </nav>
        <div class="top-actions">
          <span class="live-pill" id="live-pill" aria-live="polite">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="status">Loading…</span>
          </span>
          <button type="button" id="refresh" class="btn">Refresh</button>
        </div>
      </header>

      <main class="page">
        <div id="stale-banner" class="banner" hidden></div>
        <!-- View templates mount here from js/views/* -->
        <div id="views"></div>
      </main>

      <footer class="foot">
        <span class="brand-mark sm" aria-hidden="true"></span>
        DEX Ops · local operator console · auto-refresh 15s
        <a class="foot-link" href="http://127.0.0.1:3001/api/docs" target="_blank" rel="noreferrer">API docs</a>
      </footer>
    </div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
